<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AgendaMédica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 24px;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.is-invalid {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            color: #764ba2;
        }

        .terms {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🏥</div>
            <h1 class="title">AgendaMédica</h1>
            <p class="subtitle">Crea tu cuenta</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Nombre Completo</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName"
                    placeholder="Juan Pérez" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="tu@email.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="••••••••" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword"
                    placeholder="••••••••" 
                    required
                >
            </div>

            <button type="submit" class="btn-register">Registrarse</button>
        </form>

        <p class="terms">
            Al registrarte, aceptas nuestros <a href="#">Términos de Servicio</a> 
            y <a href="#">Política de Privacidad</a>
        </p>

        <p class="login-link">
            ¿Ya tienes cuenta? <a href="./login.html">Inicia sesión aquí</a>
        </p>
    </div>

    <script src="./vanilla.js"></script>
    <script src="./auth.js" type="module"></script>
    <script type="module">
        import { signUpWithEmail, initSupabase } from './auth.js';

        const { DOM, Form, Storage, Toast, Validators } = Vanilla;

        const registerForm = DOM.select('#registerForm');
        const fullNameInput = DOM.select('#fullName');
        const emailInput = DOM.select('#email');
        const passwordInput = DOM.select('#password');
        const confirmPasswordInput = DOM.select('#confirmPassword');

        const validationRules = {
            fullName: [
                { validator: (v) => Validators.required(v), message: 'El nombre es requerido' },
                { validator: (v) => Validators.minLength(v, 3), message: 'El nombre debe tener al menos 3 caracteres' },
            ],
            email: [
                { validator: (v) => Validators.required(v), message: 'El email es requerido' },
                { validator: (v) => Validators.email(v), message: 'Email inválido' },
            ],
            password: [
                { validator: (v) => Validators.required(v), message: 'Contraseña requerida' },
                { validator: (v) => Validators.minLength(v, 6), message: 'Mínimo 6 caracteres' },
            ],
            confirmPassword: [
                { validator: (v) => Validators.required(v), message: 'Confirma tu contraseña' },
            ],
        };

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initSupabase();
            } catch (error) {
                Toast.error('Error al inicializar la aplicación');
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const validation = Form.validate(registerForm, validationRules);

            if (!validation.isValid) {
                const firstError = Object.values(validation.errors)[0][0];
                Toast.error(firstError);
                return;
            }

            const fullName = Form.getValue(registerForm, 'fullName');
            const email = Form.getValue(registerForm, 'email');
            const password = Form.getValue(registerForm, 'password');
            const confirmPassword = Form.getValue(registerForm, 'confirmPassword');

            if (password !== confirmPassword) {
                Toast.error('Las contraseñas no coinciden');
                return;
            }

            const submitButton = registerForm.querySelector('.btn-register');
            submitButton.disabled = true;
            submitButton.textContent = 'Registrando...';

            Toast.info('Creando tu cuenta...');
            const result = await signUpWithEmail(email, password, { full_name: fullName });

            if (result.success) {
                Toast.success('¡Cuenta creada exitosamente!');
                Form.clear(registerForm);
                await Vanilla.Utils.delay(2000);
                window.location.href = './login.html';
            } else {
                Toast.error(result.error || 'Error al registrarse');
                submitButton.disabled = false;
                submitButton.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
